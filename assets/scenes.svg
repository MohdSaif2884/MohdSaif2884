<svg xmlns="http://www.w3.org/2000/svg"
width="840" height="210"
viewBox="0 0 840 210">

<defs>

<linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#17120a"/>
<stop offset="1" stop-color="#0b0803"/>
</linearGradient>

<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#b8860b"/>
<stop offset=".5" stop-color="#ffe08a"/>
<stop offset="1" stop-color="#b8860b"/>

<animate attributeName="x1"
values="-1;1" dur="4s"
repeatCount="indefinite"/>

<animate attributeName="x2"
values="0;2" dur="4s"
repeatCount="indefinite"/>

</linearGradient>

<clipPath id="card">
<rect width="840" height="210" rx="16"/>
</clipPath>

</defs>

<style>

text {
font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;
fill:#e8dfc4;
}

.m {
font-family:'Courier New',Consolas,monospace;
}

.lbl {
font:700 10px 'Courier New',Consolas,monospace;
letter-spacing:4px;
fill:#b8860b;
}

.fade {
opacity:0;
animation:fade-in 1s ease forwards;
}

@keyframes fade-in {
to { opacity:1; }
}

</style>

<g clip-path="url(#card)">

<rect width="840" height="210"
fill="url(#background)"/>

<rect x=".5" y=".5"
