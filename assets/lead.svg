<svg xmlns="http://www.w3.org/2000/svg"
width="840" height="160"
viewBox="0 0 840 160">

<defs>

<linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#17120a"/>
<stop offset="1" stop-color="#0b0803"/>
</linearGradient>

<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#b8860b"/>
<stop offset=".5" stop-color="#ffe08a"/>
<stop offset="1" stop-color="#b8860b"/>

<animate attributeName="x1"
values="-1;1" dur="4s"
repeatCount="indefinite"/>

<animate attributeName="x2"
values="0;2" dur="4s"
repeatCount="indefinite"/>

</linearGradient>

<clipPath id="card">
<rect width="840" height="160" rx="16"/>
</clipPath>

</defs>

<style>

text {
font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;
fill:#e8dfc4;
}

.m {
font-family:'Courier New',Consolas,monospace;
}

.lbl {
font:700 10px 'Courier New',Consolas,monospace;
letter-spacing:4px;
fill:#b8860b;
}

.fade {
opacity:0;
animation:fade-in 1s ease forwards;
}

@keyframes fade-in {
to { opacity:1; }
}

</style>

<g clip-path="url(#card)">

<rect width="840" height="160"
fill="url(#background)"/>

<rect x=".5" y=".5"
width="839" height="159"
rx="16"
fill="none"
stroke="#3a2e10"/>


<text class="lbl" x="30" y="36">
THE LEAD
</text>

<text x="30" y="78"
font-size="26"
font-weight="700">

Mohd Saif

</text>

<text x="30" y="104"
font-size="14"
style="fill:#8a7a4a">

B.Tech AI @ KIET. AWS certified. Building, shipping, repeat.

</text>

<text class="m"
x="30" y="132"
font-size="11"
style="fill:#8a7a4a">

Ghaziabad, India
· @MohdSaif2884
· 3 followers
· 45 repositories

</text>

<circle cx="760" cy="80"
r="46"
fill="#1d160a"
stroke="#f5c542"
stroke-width="3">

<animate attributeName="stroke-opacity"
values="1;.4;1"
dur="3s"
repeatCount="indefinite"/>

</circle>

<text x="760" y="92"
text-anchor="middle"
font-size="32"
font-weight="800"
style="fill:#f5c542">

MS

</text>


</g>
</svg>